<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; connect-src https://*.supabase.co https://*.tile.openstreetmap.org wss://*.supabase.co; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com;" />
  <title>Phoenix Transport - Live Tracking</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .dashboard-layout {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 220px;
      background: linear-gradient(180deg, #5C0E1A 0%, #8B1A2B 100%);
      color: var(--color-white);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-brand {
      padding: 0 16px 20px;
      border-bottom: 1px solid rgba(212, 168, 67, 0.3);
      margin-bottom: 12px;
    }

    .sidebar-brand h2 {
      font-size: 15px;
      font-weight: 600;
    }

    .sidebar-nav {
      list-style: none;
      flex: 1;
    }

    .sidebar-nav li a {
      display: block;
      padding: 10px 20px;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.2s, color 0.2s;
    }

    .sidebar-nav li a:hover,
    .sidebar-nav li a.active {
      background-color: rgba(212, 168, 67, 0.15);
      color: #D4A843;
      border-left: 3px solid #D4A843;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar-footer button {
      width: 100%;
      padding: 8px;
      font-size: 12px;
      font-weight: 500;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-family: var(--font-family);
    }

    .sidebar-footer button:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* Tracking-specific layout: full-width map with trip sidebar panel */
    .tracking-layout {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Left trip panel */
    .trip-panel {
      width: 320px;
      min-width: 320px;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 500;
    }

    .trip-panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .trip-panel-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 10px;
    }

    .trip-panel-header .trip-summary {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--color-text-muted);
    }

    .trip-summary .summary-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .trip-summary .summary-count {
      font-weight: 700;
      color: var(--color-text);
    }

    .trip-search {
      padding: 10px 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .trip-search input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-sm);
      font-size: 12px;
      background: var(--color-background);
    }

    .trip-search input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .trip-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 8px;
    }

    .trip-list li {
      padding: 10px 12px;
      border-radius: var(--border-radius);
      margin-bottom: 4px;
      cursor: pointer;
      transition: background-color 0.15s;
      border: 1px solid transparent;
    }

    .trip-list li:hover {
      background: var(--color-background);
      border-color: var(--color-border);
    }

    .trip-list li.selected {
      background: rgba(139, 26, 43, 0.05);
      border-color: var(--color-primary);
    }

    .trip-list li .trip-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .trip-list li .trip-vehicle {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text);
    }

    .trip-list li .trip-status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .trip-status-on_time {
      background: #d4edda;
      color: #155724;
    }

    .trip-status-delayed {
      background: #fff3cd;
      color: #856404;
    }

    .trip-status-signal_lost {
      background: #e2e3e5;
      color: #383d41;
    }

    .trip-list li .trip-route-name {
      font-size: 11px;
      color: var(--color-text-light);
      margin-bottom: 2px;
    }

    .trip-list li .trip-meta {
      font-size: 11px;
      color: var(--color-text-muted);
      display: flex;
      gap: 10px;
    }

    /* Full-screen map area */
    #tracking-map {
      flex: 1;
      z-index: 1;
    }

    /* Alert banner */
    .alert-banner {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      max-width: 350px;
    }

    .alert-toast {
      background: var(--color-white);
      border: 1px solid var(--color-danger);
      border-left: 4px solid var(--color-danger);
      border-radius: var(--border-radius);
      padding: 10px 14px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-md);
      font-size: 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      animation: slideIn 0.3s ease-out;
    }

    .alert-toast.alert-warning {
      border-color: var(--color-warning);
      border-left-color: var(--color-warning);
    }

    .alert-toast .alert-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .alert-toast .alert-content {
      flex: 1;
    }

    .alert-toast .alert-title {
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 2px;
    }

    .alert-toast .alert-message {
      color: var(--color-text-light);
    }

    .alert-toast .alert-dismiss {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      font-size: 14px;
      padding: 0 2px;
    }

    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Empty state for trip list */
    .trip-list-empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--color-text-muted);
      font-size: 12px;
      font-style: italic;
    }

    /* Signal lost marker style override */
    .marker-signal-lost {
      filter: grayscale(100%) opacity(0.7);
    }

    .marker-deviation {
      filter: hue-rotate(180deg) saturate(2);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <h2>🚌 Phoenix Transport</h2>
        </div>
        <ul class="sidebar-nav">
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="vehicles.html">Vehicles</a></li>
          <li><a href="routes.html">Routes</a></li>
          <li><a href="schedules.html">Schedules</a></li>
          <li><a href="students.html">Students</a></li>
          <li><a href="schools.html">Schools</a></li>
          <li><a href="tracking.html" class="active">Live Tracking</a></li>
          <li><a href="billing.html">Billing</a></li>
          <li><a href="reports.html">Reports</a></li>
          <li><a href="audit.html">Audit Log</a></li>
        </ul>
        <div class="sidebar-footer">
          <button id="logout-btn">Sign Out</button>
          <div style="text-align:center;margin-top:12px;font-size:10px;color:rgba(255,255,255,0.4);">
            Developed by Freddy<br><span style="color:#D4A843;font-weight:600;letter-spacing:1px;">PhoenixInc</span>
          </div>
        </div>
      </aside>

      <!-- Tracking Layout -->
      <div class="tracking-layout">
        <!-- Trip List Panel -->
        <div class="trip-panel">
          <div class="trip-panel-header">
            <h3>🛰️ Active Trips</h3>
            <div class="trip-summary">
              <div class="summary-item">
                <span class="summary-count" id="count-total">0</span> total
              </div>
              <div class="summary-item">
                <span class="summary-count" id="count-on-time">0</span> on time
              </div>
              <div class="summary-item">
                <span class="summary-count" id="count-delayed">0</span> delayed
              </div>
            </div>
          </div>
          <div class="trip-search">
            <input type="text" id="trip-search-input" placeholder="Search vehicle or route..." />
          </div>
          <ul class="trip-list" id="trip-list">
            <li class="trip-list-empty">Loading active trips...</li>
          </ul>
        </div>

        <!-- Map -->
        <div id="tracking-map"></div>

        <!-- Alert Toasts -->
        <div class="alert-banner" id="alert-banner"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../scripts/init.js"></script>
  <script src="../scripts/auth-guard.js"></script>
  <script type="module" src="../scripts/supabase-bundle.js"></script>
  <script src="../scripts/tracking.js" defer></script>
</body>
</html>
